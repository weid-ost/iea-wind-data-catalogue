# groups.yaml — CKAN-shaped group definitions. Groups ARE the IEA Wind Tasks.
#
# Canonical data in the repo (plan §2.2). A record's `groups[].name` MUST
# reference a `name` below or the CKAN-compat gate fails. `iea_task` extras
# hold these same names.
#
# `aliases` carries every other string that means this task — most importantly
# the RENUMBERINGS (fixture iea-08): task pages cite both the old and the new
# number, sometimes in the same sentence, and both must resolve to one group.
# Resolve through harvest.config.canonical_group(); never string-match.
#
# Task titles and URLs marked "verified" were read from iea-wind.org on
# 2026-08-31. Completed tasks predating that navigation are marked
# `unverified: true` and carry no URL rather than a guessed one.

