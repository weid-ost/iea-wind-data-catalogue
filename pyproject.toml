[project]
name = "harvest"
version = "0.1.0"
description = "IEA Wind Data Catalogue harvester — deterministic Tier-1 adapters, event log, CKAN-compatible record materialisation."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [{ name = "Tom Clark", email = "tom@octue.com" }]

# ---------------------------------------------------------------------------
# ADR-0034: pinned everything, no auto-updates.
# ADR-0033: direct runtime dependencies are capped at FOUR. Do not add a fifth.
# ADR-0035: no LLM vendor SDK — GitHub Models is OpenAI-compatible HTTP.
# ---------------------------------------------------------------------------
dependencies = [
    "httpx==0.28.1",
    "trafilatura==2.2.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
]

[project.scripts]
harvest = "harvest.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harvest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:harvest.*"]
