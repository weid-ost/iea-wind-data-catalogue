# sources.yaml — the source register.
#
# The only "config" that matters (plan §3.2). One top-level key per source; the
# key IS the adapter module name, the class's `source_name`, and the
# `source_system` recorded on every event. Those four strings must agree.
#
# Fields every source carries:
#   enabled      bool  — false disables the adapter without deleting its config
#   tier         1|2|3 — 1 structured API (never LLM), 2 structured-ish HTML/API,
#                        3 heterogeneous HTML (the only tier allowed a model)
#   precedence   int   — lower wins when several sources describe one identity.
#                        DOI registries outrank repositories outrank HTML.
#   max_records  int   — the prototype cap. FIVE. Raise consciously.
#   source_key   str   — human-readable semantics of the change token (plan §4.1).
#                        The adapter owns the implementation; this documents it.
#
# Everything else is adapter-specific and reaches the adapter as
# `SourceConfig.options`.
#
# All endpoints, communities, orgs and task URLs below were verified live on
# 2026-08-31. Anything unverified is marked `unverified: true`.

version: 1

defaults:
  max_records: 5
  user_agent: "iea-wind-data-catalogue/0.1 (+https://github.com/thclark/iea-wind-data-catalogue; tom@octue.com)"
  respect_robots: true
  min_request_interval_seconds: 0.2

sources:

  # -------------------------------------------------------------------------
  datacite:
    enabled: true
    tier: 1
    precedence: 10
    max_records: 5
    source_key: "attributes.updated — reflects client metadata pushes"
    api: "https://api.datacite.org/dois"
    # Only `findable` DOIs become records (fixture dc-04). `registered` and
    # `draft` DOIs have no indexed landing page: cataloguing one publishes a
    # dead citation.
    state: findable
    # QUERY STRATEGY: query strings, not client ids and not prefixes.
    # Verified live 2026-08-31:
    #   * https://api.datacite.org/clients?query=IEA+Wind returns ZERO clients —
    #     there is no IEA Wind DataCite client to sweep.
    #   * the 391 IEA-Wind-relevant DOIs these queries reach are spread across
    #     cern.zenodo (353), doe.pnnl, tib.ubs, tib.fraunirb, dk.dtic, rg.rg,
    #     arxiv.content, tib.tib, bl.mendeley, ethz.zhaw and doe.osti.
    #   * the dominant prefix is 10.5281, which is the whole of Zenodo — a bare
    #     prefix sweep would enumerate millions of unrelated DOIs. There is
    #     therefore no `prefixes:` key here, deliberately.
    # Each query is one request; hit counts are as of 2026-08-31.
    queries:
      - '"IEA Wind Task"'                                                          # 308
      - '"IEA Wind TCP"'                                                           # 65
      - 'subjects.subject:"IEA Wind Task"'                                         # 10
      - 'creators.affiliation.name:"IEA Wind" OR descriptions.description:"IEA Wind"'  # 334
    # Newest metadata push first, so the five-record window tracks the source
    # key rather than an arbitrary corner of the corpus.
    sort: "-updated"
    page_size: 25

  # -------------------------------------------------------------------------
  crossref:
    enabled: true
    tier: 1
    precedence: 20
    max_records: 5
    source_key: "deposited.date-time — NOT indexed, which churns without content change"
    api: "https://api.crossref.org/works"
    # Land in the polite pool. The project User-Agent already carries the address.
    mailto: "tom@octue.com"
    # All three ISSNs verified live against api.crossref.org on 2026-08-31.
    # `journals` is the register the `filter: issn:` queries below draw on; the
    # adapter reads `queries`, not this list.
    journals:
      - issn: "2366-7451"           # verified: Wind Energy Science, Copernicus GmbH
        title: "Wind Energy Science"
      - issn: "1095-4244"           # verified: Wind Energy, Wiley (fixtures cr-05, cr-07)
        title: "Wind Energy"
      - issn: "1742-6596"           # verified: J. Phys. Conf. Ser., IOP (fixture cr-03)
        title: "Journal of Physics: Conference Series"
        note: "TORQUE / EAWE / WindEurope proceedings live here (fixture cr-03)"
    # The queries, decided by Track C and verified live 2026-08-31. Each entry
    # is passed to https://api.crossref.org/works verbatim, plus `rows`,
    # `select` and `mailto`.
    #
    # NOTE on sorting: `sort=deposited` is deliberately absent. It ranks the
    # whole 160-million-work corpus by deposit time and, at a five-record cap,
    # returns unrelated chemistry. Crossref's relevance ranking, checked live,
    # returns the IEA Wind task literature at the top. The source key is still
    # `deposited` — sorting and change detection are different questions.
    queries:
      - name: "iea-wind-task-by-title"
        note: "Works that name an IEA Wind task: task reports, benchmarks, overviews."
        params:
          query.title: "IEA Wind Task"
      - name: "wind-energy-science-iea-wind"
        note: "The anchor journal, narrowed to IEA-Wind-relevant works."
        params:
          filter: "issn:2366-7451"
          query.bibliographic: "IEA Wind"
    # Upper bound on rows per query; the adapter asks for min(rows, limit + 5).
    rows: 20

  # -------------------------------------------------------------------------
  zenodo:
    enabled: true
    tier: 1
    precedence: 30
    max_records: 5
    source_key: "revision (top-level int) + version DOI — field name VERIFIED live 2026-08-31"
    api: "https://zenodo.org/api/records"
    # zenodo.org/robots.txt carries `Disallow: /api`. That directive addresses
    # search-engine crawlers indexing API responses; Zenodo documents, publishes
    # and rate-limits this REST API for exactly the programmatic metadata use
    # made here, and we identify ourselves with a contact address. We therefore
    # opt out of robots for this source and slow ourselves to 1 req/s — inside
    # Zenodo's documented 60/minute anonymous budget. Set this back to `true`
    # and the adapter reports the source unreachable rather than fetching.
    respect_robots: false
    min_request_interval_seconds: 1.0
    # Verified live against https://zenodo.org/api/records?communities=<slug>
    # on 2026-08-31: all nine return 200 with a non-zero hit count.
    # Catalogue the CONCEPT doi, never the version doi (fixture zen-02).
    communities:
      - slug: "iea_wind_task_43"
        title: "IEA Wind Task 43: Wind Energy Digitalization"
        iea_task: ["task-43"]
      - slug: "ieawindtask32"
        title: "IEA Wind Task 32: Wind Lidar"
        iea_task: ["task-32"]
      - slug: "ieawindtask52"
        title: "IEA Wind Task 52"
        iea_task: ["task-52"]
      - slug: "lidar_ontology"
        title: "Lidar Ontology — IEA Wind TCP Task 52"
        iea_task: ["task-52"]
      - slug: "coldclimatewind"
        title: "IEA Wind TCP Cold Climate Wind Task results"
        iea_task: ["task-54"]
      - slug: "ieawindtask51_austria"
        title: "IEA Wind TCP Task 51 Austria"
        iea_task: ["task-51"]
      - slug: "ieawindtask56-oc7-wp22"
        title: "IEA Wind Task 56: WP2.2 of OC7 Project Phase II"
        iea_task: ["task-56"]
      - slug: "jam"
        title: "IEA Wind Task 57 — JAM"
        iea_task: ["task-57"]
      - slug: "wakebench"
        title: "IEA-Wind Task 31 Wakebench"
        iea_task: ["task-31"]
    queries:
      - '"IEA Wind Task"'

  # -------------------------------------------------------------------------
  osti:
    enabled: true
    tier: 1
    precedence: 40
    max_records: 5
    source_key: "metadata-updated field if provided, else normalised payload hash"
    api: "https://www.osti.gov/api/v1/records"
    unverified: true
    queries:
      - '"IEA Wind"'
      - '"IEA Wind Task"'
    research_orgs:
      - "National Renewable Energy Laboratory"
      - "Pacific Northwest National Laboratory"
      - "Sandia National Laboratories"
    rows: 25

  # -------------------------------------------------------------------------
  wdh:
    enabled: true
    tier: 2
    precedence: 50
    max_records: 5
    source_key: "dataset-updated field if provided, else normalised payload hash"
    base_url: "https://wdh.energy.gov"          # verified: 200
    legacy_hosts:                                # verified: 301 -> wdh.energy.gov
      - "a2e.energy.gov"
    api: "https://wdh.energy.gov/api"
    unverified: true
    # Spike 4: the listing endpoint may require a token we do not have. If so
    # the adapter raises SourceUnreachable and disables itself cleanly
    # (fixture wdh-07). NEVER enumerate a dataset's files (fixture wdh-03).
    enumerate_files: false

  # -------------------------------------------------------------------------
  github:
    enabled: true
    tier: 1
    precedence: 60
    max_records: 5
    source_key: "default-branch SHA + latest release tag + hash(description, topics, licence)"
    api: "https://api.github.com"
    # Authenticate with the Actions GITHUB_TOKEN: 5,000/hr vs 60/hr.
    token_env: "GITHUB_TOKEN"
    # Re-verified live on 2026-08-31 against GET /orgs/<login>: every login
    # below returned 200. `IEAWindTask43` and `IEAWindTask32` do NOT exist —
    # Task 43's org is `IEA-Task-43`. Never guess an org name from a task
    # number, exactly as with the iea-wind.org task slugs.
    orgs:
      - login: "IEAWindSystems"                  # verified: 12 public repos
        title: "IEA Wind Systems"
        iea_task: ["task-37"]
      - login: "IEA-Task-43"                     # verified: 7 public repos
        title: "IEA Wind Digitalization (Task 43)"
        iea_task: ["task-43"]
      - login: "IEAWindTask37"                   # verified: 1 public repo
        title: "IEA Wind Task 37"
        iea_task: ["task-37"]
      - login: "IEAWindTask52"                   # verified: 3 public repos
        title: "IEA Wind Task 52"
        iea_task: ["task-52"]
      - login: "IEA-Wind-Task-32"                # verified: 13 public repos
        title: "IEA Wind Task 32 - Wind Lidar"
        iea_task: ["task-32"]
    # Repositories named by path. Fetched through GET /repos/<owner>/<name>,
    # which follows GitHub's rename/transfer 301 (fixture gh-07), and the home
    # for task code living in an individual's account (fixture gh-08).
    repos: []
    # Code also lives in individuals' accounts (fixture gh-08); topic search
    # is the other way to reach it. Reached only once org enumeration has not
    # already filled max_records, which at five it always does.
    topics:
      - "iea-wind"
      - "iea-task-43"
      - "wind-energy"
    exclude_forks: true       # fixture gh-04 — or you catalogue fifty copies
    min_content_bytes: 2048   # fixture gh-10 — empty/template repos are noise

  # -------------------------------------------------------------------------
  ieawind:
    enabled: true
    tier: 3
    precedence: 90
    max_records: 5
    source_key: "normalised main-content hash (= the LLM cache key input)"
    base_url: "https://iea-wind.org"
    # Verified live on 2026-08-31 from the iea-wind.org navigation. Note that
    # the site's URL slugs are NOT uniform, and /task11/ actually serves
    # Task 65 — never construct a task URL by string formatting.
    task_pages:
      - { iea_task: "task-25", url: "https://iea-wind.org/task25-63/", title: "Task 25/63 – TWENTY-FIVE" }
      - { iea_task: "task-41", url: "https://iea-wind.org/task41/", title: "Task 41 – Distributed Wind" }
      - { iea_task: "task-42", url: "https://iea-wind.org/task42/", title: "Task 42 – Wind Turbine Lifetime Extension" }
      - { iea_task: "task-43", url: "https://iea-wind.org/task43/", title: "Task 43 – Digitalization" }
      - { iea_task: "task-44", url: "https://iea-wind.org/task44/", title: "Task 44 – Farm Flow Control" }
      - { iea_task: "task-45", url: "https://iea-wind.org/task45/", title: "Task 45 – Recycling" }
      - { iea_task: "task-46", url: "https://iea-wind.org/task46/", title: "Task 46 – Erosion" }
      - { iea_task: "task-47", url: "https://iea-wind.org/task47/", title: "Task 47 – TURBINIA" }
      - { iea_task: "task-48", url: "https://iea-wind.org/task48/", title: "Task 48 – Airborne" }
      - { iea_task: "task-49", url: "https://iea-wind.org/task49/", title: "Task 49 – IDEA" }
      - { iea_task: "task-50", url: "https://iea-wind.org/task50/", title: "Task 50 – Hybrid Power Plants" }
      - { iea_task: "task-51", url: "https://iea-wind.org/task51/", title: "Task 51 – Forecasting" }
      - { iea_task: "task-52", url: "https://iea-wind.org/task52/", title: "Task 52 – Large-scale Wind Lidar" }
      - { iea_task: "task-53", url: "https://iea-wind.org/task53/", title: "Task 53 – Wind Energy Economics" }
      - { iea_task: "task-54", url: "https://iea-wind.org/task54/", title: "Task 54 – Cold Climate Wind Power" }
      - { iea_task: "task-55", url: "https://iea-wind.org/task55/", title: "Task 55 – REFWIND" }
      - { iea_task: "task-56", url: "https://iea-wind.org/task-56-oc7-project-offshore-code-comparison-collaboration-7/", title: "Task 56 – OC7" }
      - { iea_task: "task-57", url: "https://iea-wind.org/task57/", title: "Task 57 – JAM" }
      - { iea_task: "task-58", url: "https://iea-wind.org/task-58/", title: "Task 58 – Offshore Energy Hubs" }
      - { iea_task: "task-59", url: "https://iea-wind.org/task59/", title: "Task 59 – WREN" }
      - { iea_task: "task-60", url: "https://iea-wind.org/task-60-cyclewind-harmonised-life-cycle-assessment-for-wind-power/", title: "Task 60 – CYCLEWIND" }
      - { iea_task: "task-61", url: "https://iea-wind.org/task-61/", title: "Task 61 – VRE-H2" }
      - { iea_task: "task-62", url: "https://iea-wind.org/task-62/", title: "Task 62 – Social Science" }
      - { iea_task: "task-65", url: "https://iea-wind.org/task11/", title: "Task 65 – Wind SCOUT (served from /task11/ — do not assume URL == task number)" }
    directory_url: "https://iea-wind.org/task-directory/"
    # Tier-3 pages are read with trafilatura, sanitised, DOI-swept, and only
    # then — if anything is left unidentified — sent to a model.
    extract_main_content: true
    pdf_publication_lists: false   # fixture iea-11: out of scope for v1, recorded
