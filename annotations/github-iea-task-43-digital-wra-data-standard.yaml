# Sample annotation — typing and availability the source does not state, plus
# a Tier-3 style pin. Both scalar kinds, so both are displaceable by a source
# that later starts providing the field (with a notice: fixture x-03).
#
# Reference: docs/runbooks/correct-a-record.md §3.3 and §3.6.

identity_key: "github|IEA-Task-43/digital-wra-data-standard"
actor: "curator:tom"

annotations:

  # §3.3 — a scalar addition. GitHub does not type a repository as software;
  # we do. If the source ever starts providing resource_kind, the SOURCE WINS,
  # this value stays in the log forever, and a displacement notice appears in
  # the run report. That is the design, not a bug.
  - local:
      resource_kind: "software"
      access_status: "open"
    note: "GitHub does not type repositories; open by observation of the licence file"
    observed_at: "2026-08-28T10:00:00Z"

  # §3.1 — task attribution, set-valued as always.
  - local:
      iea_task: ["task-43"]
    note: "the repository is the Task 43 WRA data standard"
    observed_at: "2026-08-28T10:05:00Z"

  # §3.6 — a pinned extraction (ADR-0038 §4.3, fixture x-09). pin_source_key is
  # the content hash the pin was made against — the same value as the Tier-3
  # source key and the extraction cache-key input. Record it always: it is what
  # lets the system notice that the page moved beneath the judgement, at which
  # point the pin HOLDS and a pin_notice fires.
  - local:
      pinned: true
      pin_source_key: "a1b2c3d4e5f60718"
    note: "pinned: the model classified this as a report; it is software"
    observed_at: "2026-08-28T10:10:00Z"
